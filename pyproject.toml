    "antspyx>=0.6.2",
    "captum>=0.8.0",
    # "causal-conv1d>=1.6.0",           # For mamba
    "conllu>=6.0.0",
    "exca>=0.5.0",
    "fastdtw>=0.3.4",
    "flash-linear-attention>=0.4.1", # For RWKV
    "hf-xet>=1.1.1",
    "huggingface-hub>=0.36.0",
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "joblib>=1.5.0",
    "llm2vec>=0.2.1",
    "loguru>=0.7.3",
    # "mamba-ssm>=2.3.0",               # For mamba
    "matplotlib>=3.10.1",
    "mypy>=1.15.0",
    "nbformat>=5.10.4",
    "nibabel>=5.3.3",
    "nilearn>=0.13.0",
    "nvitop>=1.5.1",
    "pandas-stubs>=2.2.3.250308",
    "pandas>=2.2.3",
    "parametrization-cookbook>=0.18",
    "parquet>=1.3.1",
    "plotly>=6.0.1",
    # "protobuf>=6.33.4",               # For microsoft/deberta-v3-base
    "pyarrow>=23.0.1",
    "pydantic>=2.11.1",
    "pytest>=8.3.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1", # For XLM-Roberta
    "sqlmodel>=0.0.24",
    "statsmodels>=0.14.4",
    "tabulate>=0.9.0",
    "torch>=2.10.0",
    "torchsort>=0.1.10",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.53.0,<5.0.0", # For EuroBERT and T5Gemma
