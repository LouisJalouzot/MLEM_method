    "captum>=0.8.0",
    "conllu>=6.0.0",
    "exca>=0.5.0",
    "hf-xet>=1.1.1",
    "huggingface-hub[cli]>=0.36.0",
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "joblib>=1.5.0",
    "llm2vec>=0.2.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "mypy>=1.15.0",
    "nbformat>=5.10.4",
    "nibabel>=5.3.3",
    "nilearn>=0.13.0",
    "nvitop>=1.5.1",
    "pandas-stubs>=2.2.3.250308",
    "pandas>=2.2.3",
    "parametrization-cookbook>=0.18",
    "parquet>=1.3.1",
    "plotly>=6.0.1",
    "pydantic>=2.11.1",
    "pytest>=8.3.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "sqlmodel>=0.0.24",
    "statsmodels>=0.14.4",
    "tabulate>=0.9.0",
    "torch>=2.6.0",
    "torchsort>=0.1.10",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.50.1",
