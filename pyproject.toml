[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlem-method"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "antspyx>=0.6.2",
    "bitsandbytes>=0.49.2",           # For RWKV/v6-Finch-*-HF
    "captum>=0.8.0",
    "causal-conv1d",
    "conllu>=6.0.0",
    "dtw-python>=1.7.4",
    "exca>=0.5.0",
    "flash-linear-attention>=0.4.1",  # For RWKV
    "hf-xet>=1.1.1",
    "huggingface-hub>=0.36.0",
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "joblib>=1.5.0",
    "llm2vec>=0.2.1",
    "loguru>=0.7.3",
    "mamba-ssm",
    "matplotlib>=3.10.1",
    "mlem",
    "mypy>=1.15.0",
    "nbformat>=5.10.4",
    "nibabel>=5.3.3",
    "nilearn>=0.13.0",
    "notebook>=7.5.5",
    "numpy>=2.0.0",
    "nvitop>=1.5.1",
    "pandas-stubs>=2.2.3.250308",
    "pandas>=2.2.3",
    "parametrization-cookbook>=0.18",
    "parquet>=1.3.1",
    "pip>=26.0.1",
    "plotly>=6.0.1",
    "protobuf>=6.33.4",               # For microsoft/deberta-v3-base and mistralai/Ministral-3-*B-Base-2512
    "pyarrow>=23.0.1",
    "pydantic>=2.11.1",
    "pytest-testmon>=2.2.0",
    "pytest>=8.3.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",           # For XLM-Roberta
    "sqlmodel>=0.0.24",
    "statsmodels>=0.14.4",
    "tabulate>=0.9.0",
    "torch>=2.7.0,<2.8.0",
    "torchsort>=0.1.10",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
    # "transformers<5.0.0",    # For EuroBERT
    # "transformers>=4.53.0", # For T5Gemma
    "transformers>=5.0.0", # For mistralai/Ministral-3-*B-Base-2512
    "unflatten>=0.2.0",
    "wordfreq>=3.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlem*"]

[tool.uv.sources]
torch = { index = "pytorch-cu12" }
torchvision = { index = "pytorch-cu12" }
captum = { git = "https://github.com/meta-pytorch/captum" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu12torch2.7cxx11abiTRUE-cp313-cp313-linux_x86_64.whl" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.0/mamba_ssm-2.3.0+cu12torch2.7cxx11abiTRUE-cp313-cp313-linux_x86_64.whl" }
# Pin to main until v5.3.0 ships with PR #44176 ("[Mamba] Fix kernel loading")
transformers = { git = "https://github.com/huggingface/transformers.git", branch = "main" }
torchsort = { url = "https://github.com/LouisJalouzot/torchsort/releases/download/0.0.0/torchsort-0.1.10+pt27cu12-cp313-cp313-linux_x86_64.whl" }
mlem = { git = "https://github.com/LouisJalouzot/MLEM" }

[[tool.uv.index]]
name = "pytorch-cu12"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "mlem",
]

[tool.ruff]
line-length = 120
