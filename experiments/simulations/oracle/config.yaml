base_config:
  infra:
    cluster: slurm
    job_name: simulation_oracle
    logs: .cache/logs/simulation_oracle/%j
    timeout_min: 1200
    cpus_per_task: 24
    gpus_per_node: 1
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters: {qos: qos_gpu_h100-t3, hint: nomultithread}
    folder: .cache/simulation_oracle
  dataset:
    mahalanobis: true
    simulation: {kind: mlp, gain_sigma: 1.1, noise: 0.0}
  n_perm: 20
  estimate_correlations: {product: false}
  trainer:
    kind: oracle
    representations: {level: simulated}
  fi_splits: [test]
grid_search:
  dataset.seed: [0, 1, 2, 3, 4]
grid_search_zip:
  dataset.simulation.n_numeric: [4, 8, 12, 16, 20, 24, 28, 36, 44, 60, 72, 88]
  dataset.simulation.category_cardinalities: [*q14, *q28, *q42, *q56, *q70, *q84, *q98, *q126, *q154, *q210, *q252, *q308]
