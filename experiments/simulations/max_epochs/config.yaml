target: src.feature_importance.FeatureImportance

base_config:
  dataset:
    path: simulated
    infra:
      folder: null
  trainer:
    dataloader_builder:
      cv: 0.2
    eps: 1e-9
    representations:
      level: simulated
      noise_level: 2

grid_search:
  trainer.max_epochs:
    - 1000
    - 500
    - 200
    - 100
    - 50
    - 20
    - 10
    - 7
    - 3
    - 1
  trainer.representations.seed:
    - 0
    - 1
    - 2
    - 3
    - 4
  trainer.model_builder.param:
    - triu
    - cholesky