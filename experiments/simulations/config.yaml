target: src.feature_importance.FeatureImportance

base_config:
  dataset:
    path: simulated
  trainer:
    dataloader_builder:
      cv: 0.2
    representations:
      level: simulated

grid_search:
  trainer.dataset.seed:
    - 0
    - 1
    - 2
    - 3
    - 4
  trainer.dataset.noise_level:
    - 1
    - 2
    - 3
    - 4
    - 5
  trainer.model_builder.param:
    - triu
    - cholesky