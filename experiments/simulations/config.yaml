target: mlem_method.FeatureImportance

base_config:
  dataset:
    simulation:
      kind: mds
  trainer:
    dataloader_builder:
      cv: 0.2
    representations:
      level: simulated

grid_search:
  dataset.seed:
    - 0
    - 1
    - 2
    - 3
    - 4
  dataset.simulation.noise_level:
    - 1
    - 2
    - 3
    - 4
    - 5
  trainer.model_builder.param:
    - triu
    - cholesky