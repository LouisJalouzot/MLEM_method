target: src.feature_importance.FeatureImportance

base_config:
  dataset:
    path: simulated
  trainer:
    dataloader_builder:
      cv: 0.2
    eps: 1e-9
    representations:
      level: simulated

grid_search:
  dataset.seed:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  trainer.model_builder.param:
    - triu
    - cholesky
  trainer.representations.noise_level:
    - 0.1
    - 0.5
    - 0.9
  trainer.max_epochs:
    - 10
    - 100
    - 500
    - 2000