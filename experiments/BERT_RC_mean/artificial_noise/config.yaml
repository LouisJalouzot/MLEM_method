base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    kind: mlem
    dataloader_builder:
      cv: 0.2
    representations:
      model_name: bert-base-uncased
      layer: 7
      level: sentence

grid_search_prepare:
  trainer.model_builder.param:
    - diagonal
  trainer.representations.seed:
    - 0
  trainer.representations.noise_level:
    - 0

grid_search:
  trainer.model_builder.param:
    - diagonal
    - triu
    - cholesky
  trainer.representations.seed: [0, 1, 2]
  trainer.representations.noise_level: [0, 0.1, 0.5, 1, 2]