base_config:
  infra:
    folder: .cache
    cluster: slurm
    job_name: bert_robustness
    timeout_min: 1200
    cpus_per_task: 24
    gpus_per_node: 1
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters: {qos: qos_gpu_h100-t3, hint: nomultithread}
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    kind: mlem
    dataloader_builder: {cv: 5}
    representations: {model_name: bert-base-uncased, layer: 7, level: sentence}

grid_search:
  trainer.kind: [mlem, rf, frrsa]

grid_search_zip:
  # Sample efficiency at noise=0; noise robustness on the full training pool.
  trainer.dataloader_builder.n_train: [256, 512, 1024, 2048, 4096, null, null, null, null, null]
  trainer.representations.noise_level: [0, 0, 0, 0, 0, 0, 0.1, 0.5, 1, 2]
