target: mlem.FeatureImportance
infra: layers_infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    representations:
      level: sentence
      pca: 256
  layers_infra:
    folder: .cache
    cluster: slurm
    logs: .cache/logs/agg/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
      hint: nomultithread


grid_search:
  trainer.representations.token_aggregation:
    - last
    - mean
    - none
  trainer.representations.model_name:
    # - albert/albert-base-v2 # 12M
    - bert-base-uncased
    - google/electra-base-discriminator # 0.1B
    - BAAI/bge-base-en-v1.5 # 0.1B
    - thenlper/gte-base # 0.1B
    - intfloat/e5-base-v2 # 0.1B
    - openai-community/gpt2 # 0.1B
    - EleutherAI/pythia-410m
    - EleutherAI/gpt-neo-125m
    - facebook/opt-125m
    - Qwen/Qwen2.5-0.5B
    - meta-llama/Llama-3.2-1B
    # - mistralai/Ministral-3-3B-Base-2512
    # - google-t5/t5-base # 0.2B
    # - google/flan-t5-base # 0.2B
    - google/t5gemma-b-b-ul2 # 0.6B
    - AntonV/mamba2-370m-hf
    - fla-hub/rwkv7-0.4B-world