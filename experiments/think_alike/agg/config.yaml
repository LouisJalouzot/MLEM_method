target: mlem_method.FeatureImportance
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    dataloader_builder:
      cv: 3
    representations:
      level: sentence
      pca: 256


grid_search:
  trainer.representations.token_aggregation:
    - last
    - mean
    - none
  trainer.representations.untrained:
    - true
    - false
  trainer.representations.normalize_by_word:
    - true
    - false
  trainer.representations.model_name:
    - bert-base-uncased
    - bert-large-uncased
    - openai-community/gpt2 # 0.1B
    - openai-community/gpt2-medium # 0.3B