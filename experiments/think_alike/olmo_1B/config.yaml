target: mlem.FeatureImportance
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      token_aggregation: last
      model_name: allenai/OLMo-1B-0724-hf

grid_search:
  trainer.representations.revision:
    - step0-tokens0B
    - step1000-tokens2B
    - step2000-tokens4B
    - step3000-tokens6B
    - step4000-tokens8B
    - step5000-tokens10B
