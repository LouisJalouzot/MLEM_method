target: mlem.FeatureImportance
infra: layers_infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      token_aggregation: last
      batch_size: 1
      infra: # GPU infra for computing LLM embeddings
        folder: .cache
        cluster: auto
        mode: retry
        logs: .cache/logs/focus/repr/%j
        cpus_per_task: 48
        gpus_per_node: 1
        timeout_min: 1200
        slurm_constraint: h100
        slurm_account: ioj@h100
        slurm_additional_parameters:
            hint: nomultithread
  layers_infra:
    folder: .cache
    cluster: slurm
    mode: retry
    logs: .cache/logs/focus/layers_infra/%j
    cpus_per_task: 1
    timeout_min: 1200
    slurm_partition: cpu_p1,prepost,visu,archive,compil,compil_h100
    slurm_account: ioj@cpu
    slurm_additional_parameters:
        hint: nomultithread
  map_infra:
    folder: .cache
    cluster: auto
    logs: .cache/logs/focus/map_infra/%j
    cpus_per_task: 8
    timeout_min: 1200
    slurm_partition: cpu_p1,prepost,visu,archive,compil,compil_h100
    slurm_account: ioj@cpu
    slurm_additional_parameters:
        hint: nomultithread

grid_search_prepare:
  model_name:
    # 1. Encoders (Masked Language Models)
    - albert/albert-base-v2 # 12M
    - albert/albert-large-v2 # 18M
    - albert/albert-xlarge-v2 # 60M
    - albert/albert-xxlarge-v2 # 200M

    - jhu-clsp/ettin-encoder-17m
    - jhu-clsp/ettin-encoder-32m
    - jhu-clsp/ettin-encoder-68m
    - jhu-clsp/ettin-encoder-150m
    - jhu-clsp/ettin-encoder-400m
    - jhu-clsp/ettin-encoder-1b

    # 2. Decoders (Causal Language Models)
    - openai-community/gpt2 # 0.1B
    - openai-community/gpt2-medium # 0.4B
    - openai-community/gpt2-large # 0.8B
    - openai-community/gpt2-xl # 2B

    - EleutherAI/pythia-160m
    - EleutherAI/pythia-410m
    - EleutherAI/pythia-1b
    - EleutherAI/pythia-1.4b
    - EleutherAI/pythia-2.8b

    - facebook/opt-125m
    # - facebook/opt-350m # Dropped because of projection trick only on this model
    - facebook/opt-1.3b
    - facebook/opt-2.7b
    
    # 4. State Space Models (SSMs)
    - AntonV/mamba2-130m-hf
    - AntonV/mamba2-370m-hf
    - AntonV/mamba2-780m-hf
    - AntonV/mamba2-1.3b-hf
    - AntonV/mamba2-2.7b-hf
    
    # 5. RNNs
    - fla-hub/rwkv7-191M-world
    - fla-hub/rwkv7-0.4B-world
    - fla-hub/rwkv7-1.5B-world
    - fla-hub/rwkv7-2.9B-world


