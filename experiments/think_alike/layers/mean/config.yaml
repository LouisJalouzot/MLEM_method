target: mlem.FeatureImportance
infra: infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      layer: null
      token_aggregation: mean
  infra:
    folder: .cache
    cluster: slurm
    logs: .cache/logs/layers/mean/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
        hint: nomultithread

grid_search:
  trainer.representations.model_name:
    # 1. Encoders
    - bert-base-uncased
    - bert-large-uncased

    - roberta-base
    - roberta-large

    - microsoft/deberta-v3-base
    - microsoft/deberta-v3-large

    - answerdotai/ModernBERT-base
    - answerdotai/ModernBERT-large
    
    - albert/albert-base-v2 # 12M
    - albert/albert-large-v2 # 18M
    - albert/albert-xlarge-v2 # 60M
    - albert/albert-xxlarge-v2 # 200M

    - jhu-clsp/ettin-encoder-17m
    - jhu-clsp/ettin-encoder-32m
    - jhu-clsp/ettin-encoder-68m
    - jhu-clsp/ettin-encoder-150m
    - jhu-clsp/ettin-encoder-400m
    - jhu-clsp/ettin-encoder-1b

    - FacebookAI/xlm-roberta-base # 0.3B
    - FacebookAI/xlm-roberta-large # 0.6B
    - facebook/xlm-roberta-xl # 3.5B
    - facebook/xlm-roberta-xxl # 11B

    - EuroBERT/EuroBERT-210m
    - EuroBERT/EuroBERT-610m
    - EuroBERT/EuroBERT-2.1B

    # Discriminator encoders
    - google/electra-small-discriminator # 14M
    - google/electra-base-discriminator # 0.1B
    - google/electra-large-discriminator # 0.3B

    # Modern general embedding encoders
    - BAAI/bge-small-en-v1.5 # 33M
    - BAAI/bge-base-en-v1.5 # 0.1B
    - BAAI/bge-large-en-v1.5 # 0.3B

    - thenlper/gte-small # 33M
    - thenlper/gte-base # 0.1B
    - thenlper/gte-large # 0.3B

    - intfloat/e5-small-v2 # 33M
    - intfloat/e5-base-v2 # 0.1B
    - intfloat/e5-large-v2 # 0.3B

    # 3. Encoder Decoder
    - google-t5/t5-small # 60M
    - google-t5/t5-base # 0.2B
    - google-t5/t5-large # 0.7B

    - google/flan-t5-small # 77M
    - google/flan-t5-base # 0.2B
    - google/flan-t5-large # 0.8B
    - google/flan-t5-xl # 3B
    - google/flan-t5-xxl # 11B

    - google/t5gemma-s-s-ul2 # 0.3B
    - google/t5gemma-b-b-ul2 # 0.6B
    - google/t5gemma-l-l-ul2 # 1B
    - google/t5gemma-ml-ml-ul2 # 2B
    - google/t5gemma-xl-xl-ul2 # 4B
    - google/t5gemma-2b-2b-ul2 # 6B