target: mlem_method.FeatureImportance
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      token_aggregation: last
  layers_infra:
    folder: .cache
    cluster: slurm
    job_name: pythia
    logs: .cache/logs/pythia/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
      hint: nomultithread

grid_search:
  trainer.representations.model_name:
    # - EleutherAI/pythia-14m-deduped
    # - EleutherAI/pythia-70m-deduped
    # - EleutherAI/pythia-160m-deduped
    - EleutherAI/pythia-410m-deduped
    - EleutherAI/pythia-1b-deduped
    - EleutherAI/pythia-1.4b-deduped
    # - EleutherAI/pythia-2.8b-deduped
    # - EleutherAI/pythia-6.9b-deduped
    # - EleutherAI/pythia-12b-deduped

  trainer.representations.revision:
    - step0
    - step1000
    - step2000
    - step4000
    - step6000
    - step12000
    - step24000
    - step32000
    - step42000
    - step64000
    - step80000
    - step100000
    - step125000
    - step143000
