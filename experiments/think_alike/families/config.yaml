target: mlem_method.FeatureImportance
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      token_aggregation: last
  layers_infra:
    folder: .cache
    cluster: slurm
    job_name: families
    logs: .cache/logs/families/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
      hint: nomultithread

