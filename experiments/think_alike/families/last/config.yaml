target: mlem.FeatureImportance
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      token_aggregation: last

grid_search:
  trainer.representations.model_name:
    # 2. Decoders (Causal Language Models)
    - openai-community/gpt2 # 0.1B
    - openai-community/gpt2-medium # 0.4B
    - openai-community/gpt2-large # 0.8B
    - openai-community/gpt2-xl # 2B

    - EleutherAI/pythia-160m
    - EleutherAI/pythia-410m
    - EleutherAI/pythia-1b
    - EleutherAI/pythia-1.4b
    - EleutherAI/pythia-2.8b

    - facebook/opt-125m
    # - facebook/opt-350m # Dropped because of projection trick only on this model
    - facebook/opt-1.3b
    - facebook/opt-2.7b

    - Qwen/Qwen2.5-0.5B
    - Qwen/Qwen2.5-1.5B
    - Qwen/Qwen2.5-3B
    - Qwen/Qwen2.5-7B

    # 4. State Space Models (SSMs)
    - AntonV/mamba2-130m-hf
    - AntonV/mamba2-370m-hf
    - AntonV/mamba2-780m-hf
    - AntonV/mamba2-1.3b-hf
    - AntonV/mamba2-2.7b-hf
    
    # 5. RNNs
    - fla-hub/rwkv7-191M-world
    - fla-hub/rwkv7-0.4B-world
    - fla-hub/rwkv7-1.5B-world
    - fla-hub/rwkv7-2.9B-world
    - fla-hub/rwkv7-7.2B-g0a