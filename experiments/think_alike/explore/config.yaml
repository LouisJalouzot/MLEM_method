grid_search_prepare:
  token_aggregation:
    - none
    - mean
    - first
    - last
  model_name:
    - bert-base-uncased
    - gpt2
    - answerdotai/ModernBERT-base
    - microsoft/deberta-v3-base
    - facebook/bart-base
    - state-spaces/mamba-370m-hf
    - AntonV/mamba2-370m-hf
    - RWKV/RWKV7-Goose-Pile-421M-HF
    - bigscience/bloom-560m
    - meta-llama/Llama-3.1-8B

grid_search:
  trainer.representations.model_name:
    - bert-base-uncased
    - gpt2
    - answerdotai/ModernBERT-base
    - microsoft/deberta-v3-base
    - facebook/bart-base
    - state-spaces/mamba-370m-hf
    - AntonV/mamba2-370m-hf
    - RWKV/RWKV7-Goose-Pile-421M-HF
    - bigscience/bloom-560m
    - meta-llama/Llama-3.1-8B
  trainer.representations.token_aggregation:
    - mean
    - first
    - last
    - none
  trainer.dataloader_builder.distance:
    - 2
    - cosine