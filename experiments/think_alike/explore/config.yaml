target: mlem.FeatureImportance
infra: layers_infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
      infra: # GPU infra for computing LLM embeddings
        folder: .cache
        cluster: auto
        mode: retry
        logs: .cache/logs/explore/repr/%j
        cpus_per_task: 24
        gpus_per_node: 1
        timeout_min: 1200
        slurm_constraint: h100
        slurm_account: ioj@h100
        slurm_additional_parameters:
            hint: nomultithread
  layers_infra:
    folder: .cache
    cluster: null
    logs: .cache/logs/explore/layers_infra/%j
  map_infra:
    folder: .cache
    cluster: auto
    logs: .cache/logs/explore/map_infra/%j
    cpus_per_task: 16
    timeout_min: 1200
    slurm_partition: cpu_p1,prepost,visu,archive,compil
    slurm_account: ioj@cpu
    slurm_additional_parameters:
        hint: nomultithread
