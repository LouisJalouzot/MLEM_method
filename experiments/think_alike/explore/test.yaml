target: mlem.FeatureImportance
infra: layers_infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    dataloader_builder:
      cv: 0.2
    representations:
      level: sentence

grid_search_prepare:
  token_aggregation:
    - none
  model_name:
    - facebook/bart-base

grid_search:
  token_aggregation:
    - none
  trainer.representations.model_name:
    - facebook/bart-base