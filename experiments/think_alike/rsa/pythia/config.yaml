target: mlem_method.RSA
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  representations_1:
    level: sentence
    token_aggregation: last
  representations_2:
    level: sentence
    token_aggregation: last
  map_infra:
    cluster: processpool
    max_jobs: 12
  layers_infra:
    folder: .cache
    cluster: slurm
    job_name: rsa
    logs: .cache/logs/rsa_pythia/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
      hint: nomultithread

grid_search:
  representations_1.model_name:
    - EleutherAI/pythia-410m-deduped
    - EleutherAI/pythia-1b-deduped
    - EleutherAI/pythia-1.4b-deduped
  representations_1.revision:
    - step0
    - step2000
    - step6000
    - step24000
    - step80000
    - step143000
  representations_2.model_name:
    - EleutherAI/pythia-410m-deduped
    - EleutherAI/pythia-1b-deduped
    - EleutherAI/pythia-1.4b-deduped
  representations_2.revision:
    - step0
    - step2000
    - step6000
    - step24000
    - step80000
    - step143000