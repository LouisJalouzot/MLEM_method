target: mlem_method.RSA
infra: layers_infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  representations_1:
    level: sentence
    token_aggregation: last
  representations_2:
    level: sentence
    token_aggregation: last
  map_infra:
    cluster: processpool
    max_jobs: 12
  layers_infra:
    folder: .cache
    cluster: slurm
    job_name: rsa_families
    logs: .cache/logs/rsa_families/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
      hint: nomultithread

grid_search:
  representations_1.model_name:
    - openai-community/gpt2 # 0.1B
    - openai-community/gpt2-medium # 0.4B
    - EleutherAI/pythia-1b-deduped
    - EleutherAI/pythia-1.4b-deduped
    - facebook/opt-1.3b
    - facebook/opt-2.7b
    - meta-llama/Llama-3.2-1B
    - meta-llama/Llama-3.2-3B
    # 4. State Space Models (SSMs)
    - state-spaces/mamba-130m-hf
    - AntonV/mamba2-130m-hf
    # 5. RNNs
    - RWKV/rwkv-4-1b5-pile
    - RWKV/rwkv-4-3b-pile
  representations_2.model_name:
    - openai-community/gpt2 # 0.1B
    - openai-community/gpt2-medium # 0.4B
    - EleutherAI/pythia-1b-deduped
    - EleutherAI/pythia-1.4b-deduped
    - facebook/opt-1.3b
    - facebook/opt-2.7b
    - meta-llama/Llama-3.2-1B
    - meta-llama/Llama-3.2-3B
    # 4. State Space Models (SSMs)
    - state-spaces/mamba-130m-hf
    - AntonV/mamba2-130m-hf
    # 5. RNNs
    - RWKV/rwkv-4-1b5-pile
    - RWKV/rwkv-4-3b-pile