target: mlem.FeatureImportance
infra: layers_infra
infra_prepare: trainer.representations.infra

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    device: cuda
    dataloader_builder:
      cv: 5
    representations:
      level: sentence
  layers_infra:
    folder: .cache
    cluster: slurm
    logs: .cache/logs/pca/%j
    cpus_per_task: 24
    gpus_per_node: 1
    timeout_min: 1200
    slurm_constraint: h100
    slurm_account: ioj@h100
    slurm_additional_parameters:
        hint: nomultithread


grid_search:
  trainer.representations.pca:
    - null
    - 768
  trainer.representations.token_aggregation:
    - last
    - mean
    - none
  trainer.representations.model_name:
    - EuroBERT/EuroBERT-610m
    - openai-community/gpt2-large # 0.8B
    - facebook/opt-1.3b
    - google/t5gemma-b-b-ul2 # 0.6B
    - AntonV/mamba2-780m-hf  
    - fla-hub/rwkv7-0.4B-world
