target: src.feature_importance.FeatureImportance

base_config:
  dataset:
    path: datasets/relative_clause.csv
  trainer:
    dataloader_builder:
      cv: 5
    representations:
      model_name: bert-base-uncased
      layer: 7
      level: sentence

grid_search_prepare:
  trainer.max_epochs:
    - 0

grid_search:
  trainer.model_builder.param:
    - diagonal
    - triu
    - cholesky
  trainer.max_epochs:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
    - 1000
    - 2000